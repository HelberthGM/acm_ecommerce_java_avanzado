name: CI pipeline

on:
  push:
    branches: [main, feature/ci-pipeline]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: prueba 

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       ${{ vars.DB_NAME }}
          POSTGRES_USER:     ${{ vars.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - ${{ vars.DB_PORT }}:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Base de datos PostgreSQL (usadas por docker-compose.yaml)
      DB_NAME:     ${{ vars.DB_NAME }}
      DB_USER:     ${{ vars.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_PORT:     ${{ vars.DB_PORT }}

      # Configuración para Spring Boot
      SPRING_DATASOURCE_URL:      jdbc:postgresql://localhost:${{ vars.DB_PORT }}/${{ vars.DB_NAME }}
      SPRING_DATASOURCE_USERNAME: ${{ vars.DB_USER }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 25 setup
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build + Test
        run: ./gradlew build --no-daemon  