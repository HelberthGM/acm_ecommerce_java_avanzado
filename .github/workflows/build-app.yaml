name: CI Pipeline

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Permisos necesarios para publicar en GHCR y subir análisis de seguridad
permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================
  # JOB 1: BUILD — Compila el proyecto
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: prueba # <-- Usa tus secrets/vars actuales
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25 + Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compile
        run: ./gradlew compileJava compileTestJava --no-daemon

  # ============================================================
  # JOB 2: TEST — Ejecuta pruebas con PostgreSQL
  # ============================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    environment: prueba
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       ${{ vars.DB_NAME }}
          POSTGRES_USER:     ${{ vars.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - ${{ vars.DB_PORT }}:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_NAME:     ${{ vars.DB_NAME }}
      DB_USER:     ${{ vars.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_PORT:     ${{ vars.DB_PORT }}
      SPRING_DATASOURCE_URL:      jdbc:postgresql://localhost:${{ vars.DB_PORT }}/${{ vars.DB_NAME }}
      SPRING_DATASOURCE_USERNAME: ${{ vars.DB_USER }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25 + Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

  # ============================================================
  # JOB 3: SECURITY SCAN — CodeQL + Trivy (Seguridad Integrada)
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    environment: prueba
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # --- Análisis estático con CodeQL ---
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          queries: security-and-quality

      - name: Build for CodeQL
        run: ./gradlew compileJava --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      # --- Escaneo de la imagen con Trivy ---
      - name: Build Docker image for scanning
        run: |
          ./gradlew bootJar --no-daemon
          docker build -t app:scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'app:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================================
  # JOB 4: DOCKER — Publicar en GHCR + Etiquetado Semántico
  # ============================================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # CRUCIAL: Como no modificamos el Dockerfile, debemos generar el JAR primero
      - name: Build JAR (requerido por el Dockerfile)
        run: ./gradlew bootJar --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Etiquetado Semántico ---
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # --- Login a GHCR con el token automático ---
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
